services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: citytracker
      POSTGRES_PASSWORD: citytracker
      POSTGRES_DB: citytracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U citytracker']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
