services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: citytracker
      POSTGRES_PASSWORD: citytracker
      POSTGRES_DB: citytracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U citytracker']
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://citytracker:citytracker@postgres:5432/citytracker
      PORT: 3000
      PRIM_API_KEY: ${PRIM_API_KEY:-}
    volumes:
      - ./server/src:/app/server/src
      - ./server/prisma:/app/server/prisma
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://server:3000
    volumes:
      - ./client/src:/app/client/src
      - ./client/index.html:/app/client/index.html
    depends_on:
      - server

volumes:
  postgres-data:
